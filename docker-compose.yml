services:
  n8n:
    env_file:
      - .env
    image: n8nio/n8n:1.119.0
    restart: always
    ports:
      - 5678:5678
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n-entrypoint.sh:/usr/local/bin/n8n-entrypoint.sh:ro
      - ngrok_url_volume:/ngrok-data
    entrypoint: ["/bin/sh", "/usr/local/bin/n8n-entrypoint.sh"]
    depends_on:
      ngrok:
        condition: service_healthy
        restart: true
      postgresql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # PG
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n-db
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      # QUEUE MODE
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    networks:
      - n8n-network

  n8n-worker:
    env_file:
      - .env
    image: n8nio/n8n:1.119.0
    restart: always
    command: worker
    ports:
      - 5679:5678
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ngrok_url_volume:/ngrok-data
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # PG
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n-db
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      # QUEUE MODE
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    depends_on:
      ngrok:
        condition: service_healthy
        restart: true
      postgresql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - n8n-network

  n8n-webhook:
    env_file:
      - .env
    image: n8nio/n8n:1.119.0
    restart: always
    command: webhook
    ports:
      - 5680:5678
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ngrok_url_volume:/ngrok-data
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # PG
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n-db
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      # QUEUE MODE
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    depends_on:
      ngrok:
        condition: service_healthy
        restart: true
      postgresql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - n8n-network
  
  postgresql:
    env_file:
      - .env
    image: ankane/pgvector
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    networks:
      - n8n-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data
    networks:
      - n8n-network

  ngrok:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    restart: unless-stopped
    ports:
      - 4040:4040
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
      - ./ngrok-entrypoint.sh:/usr/local/bin/ngrok-entrypoint.sh:ro
      - ngrok_url_volume:/ngrok-data
    entrypoint: ["/bin/sh", "/usr/local/bin/ngrok-entrypoint.sh"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /ngrok-data/ngrok_url.txt ] && curl -f http://localhost:4040/api/tunnels || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - n8n-network

volumes:
  n8n-data:
  postgres-data:
  redis-data:
  ngrok_url_volume:

networks:
  n8n-network:
    driver: bridge
